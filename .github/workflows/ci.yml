name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux · g++
            os: ubuntu-24.04
          - name: macOS · clang
            os: macos-15
    steps:
      - uses: actions/checkout@v4

      # Debug preset: warnings as errors + AddressSanitizer/UndefinedBehaviorSanitizer.
      - name: Configure, build and test
        run: cmake --workflow --preset debug

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The build stage runs ctest, so this fails if any test fails on Linux/g++.
      - name: Build image
        run: docker build -t ope-server .

      - name: Smoke test the container
        run: |
          docker run -d --name ope -p 8080:8080 ope-server
          for i in $(seq 1 20); do
            curl -sf localhost:8080/health && break
            sleep 0.5
          done
          curl -sf localhost:8080/health
          curl -sf localhost:8080/api/v1/price -H 'Content-Type: application/json' \
            -d '{"type":"call","spot":42,"strike":40,"expiry":0.5,"rate":0.1,"vol":0.2}' \
            | grep -q '"price":4.759'
          curl -sf localhost:8080/ | grep -q '<title>Options Pricing Engine</title>'
          docker stop ope
          docker logs ope
